# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md#default
# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
keybinding:
  universal:
    scrollUpMain: <c-b>
    scrollDownMain: <c-f>
    copyToClipboard: y

  commits:
    moveDownCommit: J # move commit down one
    moveUpCommit: K # move commit up one
    renameCommit: R
    renameCommitWithEditor: r
  files:
    commitChanges: C
    commitChangesWithEditor: c
    openStatusFilter: F
    findBaseCommitForFixup: B

os:
  editPreset: "nvim-remote"
  edit: '[ -z "$NVIM" ] && (nvim -- {{filename}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}})'
  editAtLine: '[ -z "$NVIM" ] && (nvim +{{line}} -- {{filename}}) || (nvim --server "$NVIM" --remote-send "q" &&  nvim --server "$NVIM" --remote {{filename}} && nvim --server "$NVIM" --remote-send ":{{line}}<CR>")'
  editAtLineAndWait: "nvim +{{line}} {{filename}}"
  openDirInEditor: '[ -z "$NVIM" ] && (nvim -- {{dir}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{dir}})'

git:
  overrideGpg: true
  pagers:
    - pager: delta --paging=never --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"

gui:
  scrollHeight: 20

promptToReturnFromSubprocess: false

notARepository: "skip" # prompt | create | skip
