# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md#default
# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
keybinding:
  universal:
    scrollUpMain: <c-b>
    scrollDownMain: <c-f>
    copyToClipboard: y

  commits:
    moveDownCommit: J # move commit down one
    moveUpCommit: K # move commit up one
    renameCommit: R
    renameCommitWithEditor: r
  files:
    commitChanges: C
    commitChangesWithEditor: c
    openStatusFilter: F
    findBaseCommitForFixup: B

os:
  editPreset: "nvim"

git:
  overrideGpg: true
  pagers:
    - pager: delta --paging=never --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"

gui:
  scrollHeight: 20

  # Everforest (dark) — NvChad base46 palette
  theme:
    # Border color of focused window
    activeBorderColor:
      - "#83c092"
      - bold

    # Border color of non-focused windows
    inactiveBorderColor:
      - "#656d73"

    # Border color of focused window when searching in that window
    searchingActiveBorderColor:
      - "#a7c080"
      - bold

    # Color of keybindings help text in the bottom line
    optionsTextColor:
      - "#7fbbb3"

    # Background color of selected line.
    # See https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md#highlighting-the-selected-line
    selectedLineBgColor:
      - "#3d454b"

    # Background color of selected line when view doesn't have focus.
    inactiveViewSelectedLineBgColor:
      - "#2e363c"

    # Foreground color of copied commit
    cherryPickedCommitFgColor:
      - "#7fbbb3"

    # Background color of copied commit
    cherryPickedCommitBgColor:
      - "#3d454b"

    # Foreground color of marked base commit (for rebase)
    markedBaseCommitFgColor:
      - "#dbbc7f"

    # Background color of marked base commit (for rebase)
    markedBaseCommitBgColor:
      - "#3d454b"

    # Color for file with unstaged changes
    unstagedChangesColor:
      - "#e67e80"

    # Default text color
    defaultFgColor:
      - "#d3c6aa"

promptToReturnFromSubprocess: false

notARepository: "skip" # prompt | create | skip
