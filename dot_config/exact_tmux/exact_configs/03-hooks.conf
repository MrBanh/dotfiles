# When a session closes, kill its corresponding window in floating-tmux if one exists
set-hook -g session-closed "run-shell \"tmux kill-window -t 'floating-tmux:#{hook_session_name}' 2>/dev/null || true\""

set-hook -g session-created {
  # Give the floating-tmux session a full-width centered window list with a blank padding row on top
  if-shell -F '#{==:#{hook_session_name},floating-tmux}' {
    set -t floating-tmux status 2
    set -t floating-tmux 'status-format[1]' '#[align=absolute-centre]#{W:#{E:window-status-format}#{?window_end_flag,,#{E:window-status-separator}},#{E:window-status-current-format}#{?window_end_flag,,#{E:window-status-separator}}}#[default]'
  }

  # sidekick mux sessions should hide tmux status bar
  if-shell -F '#{m:sidekick|*,#{hook_session_name}}' {
    run-shell "tmux set-option -t '#{hook_session_name}' status off"
  }

  # The floating agent-sidebar popup (prefix + e) shows a single full-screen TUI;
  # drop its status bar so the popup is all sidebar.
  if-shell -F '#{==:#{hook_session_name},agent-sidebar}' {
    set -t agent-sidebar status off
  }
}

# Hide the agent sidebar everywhere except the floating popup. Selecting an agent
# in the popup makes the plugin drop a sidebar pane alongside that agent's window;
# we want it while browsing in the popup, but NOT lingering when you later open
# that agent normally (e.g. sidekick.nvim on your main client). So whenever a
# client changes session, the helper kills sidebar panes outside the agent-sidebar
# list session — UNLESS the client that changed is the floating popup itself
# (identified by @sidebar_popup_tty), so in-popup browsing/resume keeps its
# sidebar. The popup re-adds the sidebar on resume (04-plugins.conf). Remove our prior
# copy (old and new names) first so re-sourcing stays idempotent.
run-shell 'tmux show-hooks -g after-split-window | awk "/sidekick-(kill|hide)-sidebar/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g client-session-changed | awk "/(sidekick-hide|agent-sidebar-hide)/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
set-hook -ga client-session-changed 'run-shell -b "~/.config/tmux/scripts/agent-sidebar-hide-outside.sh \"#{client_tty}\""'
