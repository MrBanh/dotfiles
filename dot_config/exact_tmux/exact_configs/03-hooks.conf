# When a session closes, kill its corresponding window in floating-tmux if one exists
set-hook -g session-closed "run-shell \"tmux kill-window -t 'floating-tmux:#{hook_session_name}' 2>/dev/null || true\""

set-hook -g session-created {
  # Give the floating-tmux session a full-width centered window list with a blank padding row on top
  if-shell -F '#{==:#{hook_session_name},floating-tmux}' {
    set -t floating-tmux status 2
    set -t floating-tmux 'status-format[1]' '#[align=absolute-centre]#{W:#{E:window-status-format}#{?window_end_flag,,#{E:window-status-separator}},#{E:window-status-current-format}#{?window_end_flag,,#{E:window-status-separator}}}#[default]'
  }

  # sidekick mux sessions should hide tmux status bar
  if-shell -F '#{m:sidekick|*,#{hook_session_name}}' {
    run-shell "tmux set-option -t '#{hook_session_name}' status off"
  }
}

# Track a per-client "return session" for prefix+Backspace (see
# scripts/workmux-return-track.sh and the binding in 05-bindings.conf). Records the
# work session you were in before selecting an agent in workmux, and freezes it
# while you're on a workmux-tracked agent pane, so an agent -> agent -> agent
# chain still returns you to where you started. This includes agents launched
# from ordinary tmux sessions. Wired on session change AND on attach (to seed
# the origin even if you never switch sessions before diving). Remove prior
# copies first so re-sourcing stays idempotent.
run-shell 'tmux show-hooks -g client-session-changed | awk "/workmux-return-track/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g client-attached | awk "/workmux-return-track/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
set-hook -ga client-session-changed 'run-shell -b "~/.config/tmux/scripts/workmux-return-track.sh \"#{client_tty}\""'
set-hook -ga client-attached 'run-shell -b "~/.config/tmux/scripts/workmux-return-track.sh \"#{client_tty}\""'
