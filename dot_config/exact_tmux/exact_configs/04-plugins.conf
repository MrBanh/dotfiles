# see ui.conf for tmux-cpu settings
set -g @plugin 'tmux-plugins/tmux-cpu'

# tmux-fzf
set -g @plugin 'sainnhe/tmux-fzf'
TMUX_FZF_LAUNCH_KEY="C-h"

# tmux-resurrect
set -g @resurrect-capture-pane-contents 'on'
## https://github.com/tmux-plugins/tmux-resurrect/blob/master/docs/restoring_programs.md
set -g @resurrect-processes '\
      "gh dash" \
      lazygit \
      yazi \
      "~opencode->opencode *" \
      "~nvim->nvim *" \
      "~bend->bend *" \
'
set -g @plugin 'tmux-plugins/tmux-resurrect' 

# tmux-continuum - automatically saves sessions for you every 15 minutes; auto restore when tmux starts
set -g @continuum-restore 'on'
set -g @plugin 'tmux-plugins/tmux-continuum' 

# tmux-yank
set -g @plugin 'tmux-plugins/tmux-yank'

# tmux-agent-sidebar
set -g @sidebar_auto_create off # don't auto-inject sidebar into every new window
set -g @sidebar_width "25%"
set -g @sidebar_notification_sound "Glass"
set -g @sidebar_icon_all ""
set -g @sidebar_icon_running ''
set -g @sidebar_icon_background '󰺕'
set -g @sidebar_icon_waiting ''
set -g @sidebar_icon_idle ''
set -g @sidebar_icon_error ''
set -g @sidebar_icon_unknown ''
set -g @plugin 'hiroppy/tmux-agent-sidebar' # Build from Source (binary is unverified)

# Initialize TMUX plugin manager (keep the run line at the very bottom of tmux.conf)
set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'

