set -g @plugin 'sainnhe/tmux-fzf'
TMUX_FZF_LAUNCH_KEY="C-h"

# persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-resurrect' 
set -g @resurrect-capture-pane-contents 'on'
## https://github.com/tmux-plugins/tmux-resurrect/blob/master/docs/restoring_programs.md
set -g @resurrect-processes '\
      "gh dash" \
      lazygit \
      yazi \
      "~opencode->opencode *" \
      "~nvim->nvim *" \
      "~bend->bend *" \
'

# automatically saves sessions for you every 15 minutes; auto restore when tmux starts
set -g @plugin 'tmux-plugins/tmux-continuum' 
set -g @continuum-restore 'on'

set -g @plugin 'tmux-plugins/tmux-yank'

# Monitors AI coding agents (opencode/claude/codex) across panes
# Install note: on `prefix + I` the wizard offers "Download binary" or "Build
# from source". Prefer "Build from source" (needs cargo) — the released binary
# is unverified (no checksum/signature).
set -g @plugin 'hiroppy/tmux-agent-sidebar'
# Don't auto-inject a sidebar into every new window: it would split into the
# floating-tmux popup (C-_) and fight tmux-resurrect/continuum restores.
set -g @sidebar_auto_create off
set -g @sidebar_width "25%"

## Status icons
set -g @sidebar_icon_all ""
set -g @sidebar_icon_running ''
set -g @sidebar_icon_background '󰺕'
set -g @sidebar_icon_waiting ''
set -g @sidebar_icon_idle ''
set -g @sidebar_icon_error ''
set -g @sidebar_icon_unknown ''

# Initialize TMUX plugin manager (keep the run line at the very bottom of tmux.conf)
set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'

# --- Route the agent sidebar into a floating popup (prefix + e) ----------------
# Runs after TPM sources the plugin above, whose own prefix+e (inline sidebar in
# the current window) and prefix+E (toggle-all) bindings would otherwise win — we
# replace them. The sidebar lives in a background `agent-sidebar` session shown in
# a centered popup; selecting an agent switches this popup client onto that agent.
#
# prefix+e is a toggle:
#   - not in the popup -> open it, RESUMING whatever session you last had up (the
#     agent you selected, or the agent-sidebar list). We remember it by session_id
#     in @sidebar_popup_session on close (agent names contain spaces / "|" that
#     break -t name matching) and re-attach it on open, falling back to the
#     agent-sidebar list when it's unset or that session has since closed.
#   - in the popup -> record the current session and detach (close).
#
# "Am I in the popup?" is tested by tty, not session_name: selecting an agent runs
# `switch-client` (src/tmux/commands.rs), moving this popup client off
# agent-sidebar, but a client keeps its tty across session switches. We stamp the
# popup's tty into @sidebar_popup_tty on open and clear it on close.
#
# On open we also self-heal agent-sidebar: tmux-resurrect restores it as a bare
# shell (the binary isn't in @resurrect-processes), so if the session isn't
# running the sidebar we recreate it.
#
# 03-hooks.conf hides the per-agent sidebar whenever a NORMAL client views that
# agent (e.g. sidekick.nvim), so it doesn't linger outside the popup. To keep the
# popup itself consistent, when we resume an agent we re-add its sidebar with
# `toggle --create-only` (a no-op if it's still there) — so the popup always shows
# [sidebar | agent] even after a main-client view stripped it.
unbind -T prefix E
bind-key e if-shell -F '#{==:#{client_tty},#{@sidebar_popup_tty}}' {
  set -gF @sidebar_popup_session "#{session_id}"
  detach-client
} {
  display-popup -w 80% -h 80% -x C -y C -b rounded -E 'bin="$(tmux show -gv @agent_sidebar_bin)"; bin="${bin:-tmux-agent-sidebar}"; tmux set -g @sidebar_popup_tty "$(tty)"; tmux list-panes -t agent-sidebar -F "#{pane_current_command}" 2>/dev/null | grep -qi agent || { tmux kill-session -t agent-sidebar 2>/dev/null; tmux new-session -d -s agent-sidebar "$bin"; }; target="$(tmux show -gv @sidebar_popup_session)"; { [ -n "$target" ] && tmux has-session -t "$target" 2>/dev/null; } || target=agent-sidebar; if [ "$target" != agent-sidebar ]; then win="$(tmux display -p -t "$target" "#{window_id}")"; wp="$(tmux display -p -t "$target" "#{pane_current_path}")"; "$bin" toggle --create-only "$win" "${wp:-~}"; fi; tmux attach-session -t "$target"; tmux set -gu @sidebar_popup_tty'
}

