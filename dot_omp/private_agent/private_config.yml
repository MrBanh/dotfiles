modelRoles:
  default: opencode-zen/muse-spark-1.2-contributor-free:xhigh
symbolPreset: nerd
theme:
  dark: matugen
setupVersion: 2
statusLine:
  separator: slash
  preset: default
  transparent: true
  compactThinkingLevel: false
  sessionAccent: true
  contextLine: annotated
tui:
  textSizing: false
display:
  showTokenUsage: false
hideThinkingBlock: true
tools:
  approvalMode: yolo
stt:
  enabled: true
disabledExtensions:
  - rule:go-add-cleanup
  - rule:go-bench-loop
  - rule:go-exp-promoted
  - rule:go-ioutil
  - rule:go-join-hostport
  - rule:go-new-expr
  - rule:go-rand-v2
  - rule:go-range-int
  - rule:rs-box-leak
  - rule:rs-future-prelude
  - rule:rs-lazylock
  - rule:rs-match-ergonomics
  - rule:rs-parking-lot
  - rule:rs-result-type
  - rule:ts-bare-catch
  - rule:ts-import-type
  - rule:ts-no-dynamic-import
  - rule:ts-promise-with-resolvers
memory:
  backend: mnemopi
autolearn:
  enabled: true
lsp:
  formatOnWrite: true
error:
  notify: "on"
composer:
  shape: rail
terminal:
  showProgress: true
edit:
  autoRepair:
    enabled: true
security:
  enabled: true
browser:
  headless: false
disabledProviders: []

